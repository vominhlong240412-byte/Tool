<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>The Love Day - Ứng dụng đếm ngày yêu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Poppins', 'Quicksand', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #ff9a9e 0%, #fad0c4 50%, #fad0c4 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container chính cho cả auth và app */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 56px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.5);
            width: 100%;
            max-width: 550px;
            padding: 30px 28px;
            transition: all 0.3s ease;
            animation: fadeSlideUp 0.6s ease-out;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1, h2 {
            text-align: center;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .app-title {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #c2185b, #ff6f61);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.05);
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-weight: 600;
            color: #b13e5c;
            font-size: 0.9rem;
            margin-left: 6px;
        }

        input {
            padding: 14px 18px;
            border: 2px solid #ffb7c5;
            border-radius: 60px;
            font-size: 1rem;
            background: white;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #e8436e;
            box-shadow: 0 0 0 3px rgba(232, 67, 110, 0.2);
        }

        button {
            background: linear-gradient(95deg, #ff758c, #ff7eb3);
            border: none;
            padding: 14px 20px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 18px rgba(233, 30, 99, 0.3);
            width: 100%;
        }

        button:active {
            transform: scale(0.97);
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.7);
            color: #c2185b;
            box-shadow: none;
            border: 1px solid #ff98ae;
            margin-top: 8px;
        }

        .flex-btns {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .heart-animation-area {
            text-align: center;
            margin: 20px 0 15px;
        }

        .beating-heart {
            font-size: 90px;
            display: inline-block;
            animation: heartbeat 1.2s infinite ease-in-out;
            filter: drop-shadow(0 8px 20px rgba(255, 40, 100, 0.5));
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.2); text-shadow: 0 0 8px #ff3b6f; }
            35% { transform: scale(1.1); }
            45% { transform: scale(1.25); }
            55% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .floating-hearts {
            position: relative;
            height: 70px;
        }

        .counter-box {
            background: #fff0f3;
            border-radius: 80px;
            padding: 18px;
            text-align: center;
            margin: 20px 0;
            box-shadow: inset 0 0 5px #ffb7c5, 0 10px 20px rgba(0,0,0,0.05);
        }

        .days-number {
            font-size: 3rem;
            font-weight: 800;
            color: #e8436e;
            letter-spacing: 2px;
        }

        .love-name-display {
            font-weight: 500;
            background: rgba(255,220,230,0.7);
            padding: 6px 14px;
            border-radius: 50px;
            display: inline-block;
            margin-top: 8px;
        }

        .toast-notify {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(16px);
            color: white;
            padding: 14px 28px;
            border-radius: 80px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            font-weight: bold;
            border-left: 6px solid #ff5e7e;
            transition: all 0.2s ease;
            pointer-events: none;
        }

        .heart-toast-icon {
            font-size: 32px;
            animation: spinHeart 0.6s infinite alternate;
        }

        @keyframes spinHeart {
            0% { transform: rotate(0deg) scale(0.9); opacity: 0.8; }
            100% { transform: rotate(15deg) scale(1.2); opacity: 1; text-shadow: 0 0 5px gold; }
        }

        .hidden {
            display: none;
        }

        .auth-switch {
            text-align: center;
            margin-top: 12px;
            font-size: 0.85rem;
        }

        .auth-switch span {
            color: #c2185b;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
        }

        hr {
            margin: 20px 0;
            border: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, #ff99aa, transparent);
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 20px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="glass-card" id="appRoot">
    <!-- KHU VỰC ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="authContainer">
        <div style="text-align: center;">
            <div class="beating-heart" style="font-size: 60px;">❤️</div>
            <h1 class="app-title">💖 The Love Day 💖</h1>
            <p style="color:#b13e5c; margin-bottom: 24px;">Lưu giữ những ngày yêu thương</p>
        </div>

        <!-- Form ĐĂNG NHẬP (mặc định hiện) -->
        <div id="loginForm">
            <div class="input-group">
                <label>📛 Tên đăng nhập</label>
                <input type="text" id="loginUsername" placeholder="vd: nguoithuong" autocomplete="off">
            </div>
            <div class="input-group">
                <label>🔒 Mật khẩu</label>
                <input type="password" id="loginPassword" placeholder="••••••">
            </div>
            <button id="doLoginBtn">🌸 Đăng nhập 🌸</button>
            <div class="auth-switch">
                Chưa có tài khoản? <span id="showRegisterBtn">Đăng ký ngay</span>
            </div>
        </div>

        <!-- Form ĐĂNG KÝ (ban đầu ẩn) -->
        <div id="registerForm" class="hidden">
            <div class="input-group">
                <label>✨ Tên đăng nhập</label>
                <input type="text" id="regUsername" placeholder="chọn tên yêu thích">
            </div>
            <div class="input-group">
                <label>🔐 Mật khẩu</label>
                <input type="password" id="regPassword" placeholder="mật khẩu của bạn">
            </div>
            <button id="doRegisterBtn">💘 Đăng ký & yêu ngay 💘</button>
            <div class="auth-switch">
                Đã có tài khoản? <span id="showLoginBtn">Đăng nhập</span>
            </div>
        </div>
    </div>

    <!-- KHU VỰC ỨNG DỤNG CHÍNH (sau khi đăng nhập) -->
    <div id="appContainer" class="hidden">
        <!-- header với nút logout -->
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <h2 class="app-title" style="font-size: 1.7rem;">❤️ The Love Day ❤️</h2>
            <button id="logoutBtn" style="width: auto; padding: 8px 16px; background: #ffb3c6; color: #a1224a;">🚪 Thoát</button>
        </div>

        <!-- Trái tim động siêu đẹp -->
        <div class="heart-animation-area">
            <div class="beating-heart">❤️</div>
            <div class="floating-hearts">
                <span style="position: relative; animation: floatHeart 2s infinite;">💖</span>
                <span style="position: relative; animation: floatHeart 2.5s infinite; left: 20px;">💗</span>
                <span style="position: relative; animation: floatHeart 1.8s infinite; left: -20px;">💓</span>
            </div>
        </div>

        <style>
            @keyframes floatHeart {
                0% { transform: translateY(0px) rotate(0deg); opacity: 0.6;}
                100% { transform: translateY(-25px) rotate(8deg); opacity: 1;}
            }
        </style>

        <!-- Nhập tên người đó -->
        <div class="input-group">
            <label>💌 Nhập tên Người đó:</label>
            <input type="text" id="partnerNameInput" placeholder="Ví dụ: Bé iu, Anh yêu, Người ấy..." autocomplete="off">
        </div>

        <!-- Nút check-in -->
        <button id="checkinBtn">✨ CHECK-IN ✨</button>

        <!-- Hiển thị số ngày đã yêu -->
        <div class="counter-box">
            <div style="font-size: 0.9rem; letter-spacing: 1px;">📅 SỐ NGÀY ĐÃ YÊU</div>
            <div class="days-number" id="daysCountDisplay">0</div>
            <div class="love-name-display" id="displayPartnerLabel">💞 Chưa có tên</div>
        </div>

        <footer>❤️ Mỗi ngày chỉ check-in một lần – Yêu thương càng thêm đong đầy ❤️</footer>
    </div>
</div>

<script>
    // ---------- CẤU HÌNH LƯU TRỮ ----------
    const STORAGE_KEY = "LoveApp_Users";
    const CURRENT_USER_KEY = "LoveApp_CurrentUser";

    // Helper: lấy danh sách users
    function getUsers() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return {};
        try {
            return JSON.parse(raw);
        } catch(e) { return {}; }
    }

    function saveUsers(users) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
    }

    // lấy user hiện tại (username)
    function getCurrentUsername() {
        return localStorage.getItem(CURRENT_USER_KEY);
    }

    function setCurrentUsername(username) {
        if (username) localStorage.setItem(CURRENT_USER_KEY, username);
        else localStorage.removeItem(CURRENT_USER_KEY);
    }

    // lấy dữ liệu tình yêu của user
    function getUserLoveData(username) {
        const users = getUsers();
        if (!users[username]) return null;
        // cấu trúc: { password, love: { partnerName, daysCount, lastCheckinDate } }
        return users[username].love || { partnerName: "", daysCount: 0, lastCheckinDate: null };
    }

    // cập nhật dữ liệu tình yêu
    function setUserLoveData(username, loveData) {
        const users = getUsers();
        if (!users[username]) return false;
        users[username].love = { ...loveData };
        saveUsers(users);
        return true;
    }

    // tạo user mới
    function registerUser(username, password) {
        const users = getUsers();
        if (users[username]) return false; // đã tồn tại
        users[username] = {
            password: password,
            love: {
                partnerName: "",
                daysCount: 0,
                lastCheckinDate: null
            }
        };
        saveUsers(users);
        return true;
    }

    // xác thực login
    function loginUser(username, password) {
        const users = getUsers();
        if (!users[username]) return false;
        return users[username].password === password;
    }

    // lấy ngày hôm nay dạng YYYY-MM-DD
    function getTodayStr() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    // Hiển thị thông báo trái tim siêu đẹp + ảnh động (toast)
    function showHeartNotification(message, extraIcon = "💖") {
        // Xoá toast cũ nếu có
        const oldToast = document.querySelector('.toast-notify');
        if(oldToast) oldToast.remove();

        const toast = document.createElement('div');
        toast.className = 'toast-notify';
        toast.innerHTML = `
            <div class="heart-toast-icon">${extraIcon}</div>
            <div style="flex:1; font-size: 1rem;">${message}</div>
            <div style="font-size: 28px; animation: spinHeart 0.3s infinite alternate;">❤️</div>
        `;
        document.body.appendChild(toast);
        
        // hiệu ứng xuất hiện
        toast.style.animation = "fadeSlideUp 0.2s ease-out";
        setTimeout(() => {
            if(toast) toast.style.opacity = "0";
            setTimeout(() => {
                if(toast && toast.remove) toast.remove();
            }, 500);
        }, 2200);
    }

    // Cập nhật toàn bộ giao diện App (tên người yêu, số ngày)
    function refreshAppUI() {
        const currentUser = getCurrentUsername();
        if (!currentUser) return;
        const loveData = getUserLoveData(currentUser);
        if (loveData) {
            const partnerInput = document.getElementById('partnerNameInput');
            if (partnerInput) partnerInput.value = loveData.partnerName || "";
            const daysSpan = document.getElementById('daysCountDisplay');
            if (daysSpan) daysSpan.innerText = loveData.daysCount || 0;
            const partnerLabel = document.getElementById('displayPartnerLabel');
            if (partnerLabel) {
                if (loveData.partnerName && loveData.partnerName.trim() !== "") {
                    partnerLabel.innerHTML = `💕 Đang yêu: ${loveData.partnerName} 💕`;
                } else {
                    partnerLabel.innerHTML = `💞 Hãy nhập tên và check-in lần đầu 💞`;
                }
            }
        } else {
            // fallback rỗng
            document.getElementById('partnerNameInput').value = "";
            document.getElementById('daysCountDisplay').innerText = "0";
            document.getElementById('displayPartnerLabel').innerHTML = "💞 Hãy nhập tên và check-in lần đầu 💞";
        }
    }

    // XỬ LÝ CHECK-IN (quan trọng)
    function handleCheckIn() {
        const currentUser = getCurrentUsername();
        if (!currentUser) {
            showHeartNotification("❌ Vui lòng đăng nhập lại!", "💔");
            return;
        }

        const partnerInput = document.getElementById('partnerNameInput');
        let partnerName = partnerInput.value.trim();
        if (partnerName === "") {
            showHeartNotification("💌 Hãy nhập tên người ấy trước khi check-in nhé!", "🌸");
            return;
        }

        const loveData = getUserLoveData(currentUser);
        if (!loveData) {
            showHeartNotification("Dữ liệu lỗi, hãy đăng xuất và đăng nhập lại", "⚠️");
            return;
        }

        const today = getTodayStr();
        let { daysCount, lastCheckinDate, partnerName: storedName } = loveData;

        // Kiểm tra nếu đã check-in hôm nay
        if (lastCheckinDate === today) {
            showHeartNotification("🌹 Hôm nay bạn đã check-in rồi! Hãy quay lại vào ngày mai nhé 🌹", "⏰");
            return;
        }

        // Logic tăng số ngày: 
        // - Nếu chưa từng check-in (lastCheckinDate === null) -> daysCount = 1
        // - Nếu ngày trước đó < hôm nay -> tăng thêm 1
        let newDaysCount;
        if (lastCheckinDate === null) {
            newDaysCount = 1;
        } else if (lastCheckinDate < today) {
            newDaysCount = daysCount + 1;
        } else {
            // Trường hợp lỗi không hợp lệ, không cho check-in
            showHeartNotification("⚠️ Ngày không hợp lệ, liên hệ hỗ trợ", "❓");
            return;
        }

        // Cập nhật dữ liệu
        const updatedLove = {
            partnerName: partnerName,   // cập nhật tên mới nhất
            daysCount: newDaysCount,
            lastCheckinDate: today
        };
        setUserLoveData(currentUser, updatedLove);

        // Cập nhật giao diện
        refreshAppUI();

        // Ảnh động & thông báo siêu đẹp (trái tim rực rỡ)
        let notiMsg = `❤️ CHECK-IN THÀNH CÔNG ❤️\nBạn đã yêu ${newDaysCount} ngày cùng ${partnerName}!`;
        showHeartNotification(notiMsg, "💘✨");

        // Tạo hiệu ứng trái tim bay phụ (ảnh động ảo diệu)
        createFlyingHeartsEffect();
    }

    // Tạo hiệu ứng trái tim bay xung quanh khi check-in (đẹp mắt)
    function createFlyingHeartsEffect() {
        const container = document.getElementById('appContainer');
        if (!container) return;
        for (let i = 0; i < 12; i++) {
            const heart = document.createElement('div');
            heart.innerHTML = ['❤️', '💖', '💗', '💓', '💘', '💝'][Math.floor(Math.random() * 6)];
            heart.style.position = 'fixed';
            heart.style.fontSize = (20 + Math.random() * 30) + 'px';
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.top = window.innerHeight - 50 + 'px';
            heart.style.pointerEvents = 'none';
            heart.style.zIndex = '9999';
            heart.style.opacity = '0.9';
            heart.style.transition = 'all 2s ease-out';
            heart.style.animation = `floatUpLove ${1 + Math.random() * 1.5}s linear forwards`;
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 2000);
        }
    }
    // Thêm keyframes động cho hiệu ứng bay
    if (!document.querySelector('#dynamicHeartStyle')) {
        const styleSheet = document.createElement('style');
        styleSheet.id = 'dynamicHeartStyle';
        styleSheet.innerText = `
            @keyframes floatUpLove {
                0% { transform: translateY(0) rotate(0deg); opacity: 1; }
                100% { transform: translateY(-400px) rotate(25deg); opacity: 0; }
            }
        `;
        document.head.appendChild(styleSheet);
    }

    // ---- Điều khiển giao diện Auth & App ----
    function showAuthScreen() {
        document.getElementById('authContainer').classList.remove('hidden');
        document.getElementById('appContainer').classList.add('hidden');
        // Reset các form
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('loginUsername').value = "";
        document.getElementById('loginPassword').value = "";
        document.getElementById('regUsername').value = "";
        document.getElementById('regPassword').value = "";
    }

    function showAppScreen() {
        document.getElementById('authContainer').classList.add('hidden');
        document.getElementById('appContainer').classList.remove('hidden');
        refreshAppUI(); // load dữ liệu user hiện tại
        // thêm hiệu ứng trái tim mừng
        setTimeout(() => {
            const currentUser = getCurrentUsername();
            if(currentUser) {
                const love = getUserLoveData(currentUser);
                if(love && love.daysCount > 0) {
                    // không spam, chỉ chào
                } else {
                    // hiện chào mừng nhẹ
                }
            }
        }, 100);
    }

    // Đăng xuất
    function logout() {
        setCurrentUsername(null);
        showAuthScreen();
        // reset các input auth
    }

    // Xử lý đăng nhập
    function attemptLogin() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!username || !password) {
            showHeartNotification("Vui lòng nhập đủ tên và mật khẩu", "🔐");
            return;
        }
        if (loginUser(username, password)) {
            setCurrentUsername(username);
            showAppScreen();
            showHeartNotification(`💖 Chào mừng ${username} trở lại! Chúc bạn ngày mới tràn đầy yêu thương.`, "💐");
        } else {
            showHeartNotification("Sai tài khoản hoặc mật khẩu ❌", "😢");
        }
    }

    // Xử lý đăng ký
    function attemptRegister() {
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value;
        if (!username || !password) {
            showHeartNotification("Vui lòng nhập tên đăng nhập và mật khẩu", "📝");
            return;
        }
        if (username.length < 3) {
            showHeartNotification("Tên đăng nhập ít nhất 3 ký tự", "💢");
            return;
        }
        if (registerUser(username, password)) {
            // đăng ký thành công -> tự động đăng nhập
            setCurrentUsername(username);
            showAppScreen();
            showHeartNotification(`🎉 Chào mừng ${username}! Hãy nhập tên người thương và check-in lần đầu tiên 🎉`, "💖✨");
            refreshAppUI();
        } else {
            showHeartNotification("Tên đăng nhập đã tồn tại, hãy chọn tên khác", "⚠️");
        }
    }

    // Chuyển đổi giữa login & register
    function toggleToRegister() {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
    }
    function toggleToLogin() {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
    }

    // Kiểm tra phiên đăng nhập khi tải trang
    function checkAutoLogin() {
        const savedUser = getCurrentUsername();
        if (savedUser) {
            const users = getUsers();
            if (users[savedUser]) {
                showAppScreen();
                return true;
            } else {
                // user không tồn tại trong db, xoá session
                setCurrentUsername(null);
                showAuthScreen();
                return false;
            }
        } else {
            showAuthScreen();
            return false;
        }
    }

    // Gắn sự kiện
    function bindEvents() {
        document.getElementById('doLoginBtn').addEventListener('click', attemptLogin);
        document.getElementById('doRegisterBtn').addEventListener('click', attemptRegister);
        document.getElementById('showRegisterBtn').addEventListener('click', toggleToRegister);
        document.getElementById('showLoginBtn').addEventListener('click', toggleToLogin);
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('checkinBtn').addEventListener('click', handleCheckIn);
        // hỗ trợ enter trên login
        const loginPass = document.getElementById('loginPassword');
        loginPass.addEventListener('keypress', (e) => { if(e.key === 'Enter') attemptLogin(); });
        const regPass = document.getElementById('regPassword');
        regPass.addEventListener('keypress', (e) => { if(e.key === 'Enter') attemptRegister(); });
        const partnerInput = document.getElementById('partnerNameInput');
        if(partnerInput) {
            partnerInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleCheckIn(); });
        }
    }

    // Khởi tạo
    function init() {
        bindEvents();
        checkAutoLogin();
        // style bổ sung cho toast
        const toastStyle = document.createElement('style');
        toastStyle.innerText = `.toast-notify { animation: fadeSlideUp 0.2s ease-out; }`;
        document.head.appendChild(toastStyle);
    }

    init();
</script>
</body>
</html>
