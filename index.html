<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>ROBLOX GARENA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background: #0b0b1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .glass {
            max-width: 420px;
            width: 100%;
            background: linear-gradient(145deg, #141428, #1e1e3a);
            border-radius: 32px;
            padding: 30px 24px 34px;
            border: 1px solid #2a2a5a;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }
        .glass::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255,215,0,0.05), transparent 70%);
            pointer-events: none;
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .logo img {
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 0 20px rgba(255,215,0,0.2));
        }
        .logo h1 {
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ff6b00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(255,215,0,0.15);
        }
        .sub {
            text-align: center;
            color: #8899bb;
            font-size: 14px;
            margin-bottom: 24px;
            border-bottom: 1px solid #222244;
            padding-bottom: 14px;
        }
        .input-group {
            margin-bottom: 14px;
        }
        .input-group label {
            display: block;
            color: #aabbdd;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid #2a2a5a;
            background: #0d0d22;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.1);
        }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            background: linear-gradient(135deg, #ffd700, #f5a623);
            color: #0b0b1a;
            box-shadow: 0 4px 24px rgba(255,215,0,0.25);
        }
        .btn:active { transform: scale(0.96); }
        .btn-secondary {
            background: transparent;
            border: 1px solid #334466;
            color: #8899bb;
            box-shadow: none;
        }
        .btn-secondary:hover { background: rgba(255,215,0,0.05); }
        .switch-link {
            color: #6688bb;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
            text-align: center;
            display: block;
            margin-top: 14px;
        }
        .switch-link:hover { color: #ffd700; }
        .hide { display: none !important; }
        .status-box {
            background: rgba(0,0,0,0.4);
            border-radius: 16px;
            padding: 18px 16px;
            border: 1px solid #2a2a5a;
            margin-top: 16px;
            text-align: center;
            color: #ffd700;
            font-size: 15px;
            line-height: 1.7;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .status-box .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid #2a2a5a;
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-box .big-icon { font-size: 48px; margin-bottom: 8px; }
        .countdown { color: #ff6b00; font-weight: 700; font-size: 20px; }
        .footer { text-align: center; font-size: 11px; color: #334466; margin-top: 16px; }
        .error-msg { color: #ff4466; font-size: 13px; text-align: center; margin-top: 8px; min-height: 20px; }
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0 12px 0;
            border-bottom: 1px solid #222244;
            margin-bottom: 12px;
        }
        .user-bar span { color: #aabbdd; font-size: 14px; }
        .user-bar .logout-btn {
            background: transparent;
            border: 1px solid #334466;
            color: #8899bb;
            padding: 4px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }
        .user-bar .logout-btn:hover { border-color: #ff4466; color: #ff4466; }
    </style>
</head>
<body>

<div class="glass" id="app">

    <!-- ===== LOGO ===== -->
    <div class="logo">
        <div style="font-size:40px;">🎮</div>
        <h1>ROBLOX</h1>
        <span style="color:#ffd700;font-weight:700;font-size:14px;background:#1a1a3e;padding:2px 12px;border-radius:20px;border:1px solid #ffd70033;">GARENA</span>
    </div>
    <div class="sub">Kết nối vũ trụ game</div>

    <!-- ===== AUTH ===== -->
    <div id="auth-section">
        <!-- Login -->
        <div id="login-form">
            <div class="input-group">
                <label>👤 Tên đăng nhập</label>
                <input type="text" id="login-username" placeholder="Nhập tên...">
            </div>
            <div class="input-group">
                <label>🔑 Mật khẩu</label>
                <input type="password" id="login-password" placeholder="Nhập mật khẩu...">
            </div>
            <button class="btn" id="login-btn">ĐĂNG NHẬP</button>
            <span class="switch-link" id="go-to-register">Chưa có tài khoản? Đăng kí</span>
            <div class="error-msg" id="auth-error"></div>
        </div>

        <!-- Register -->
        <div id="register-form" class="hide">
            <div class="input-group">
                <label>👤 Tên đăng nhập</label>
                <input type="text" id="reg-username" placeholder="Chọn tên...">
            </div>
            <div class="input-group">
                <label>🔑 Mật khẩu</label>
                <input type="password" id="reg-password" placeholder="Mật khẩu...">
            </div>
            <button class="btn" id="register-btn">ĐĂNG KÍ</button>
            <span class="switch-link" id="go-to-login">Đã có tài khoản? Đăng nhập</span>
            <div class="error-msg" id="reg-error"></div>
        </div>
    </div>

    <!-- ===== MAIN SAU LOGIN ===== -->
    <div id="main-section" class="hide">
        <div class="user-bar">
            <span id="user-display">👤 user</span>
            <button class="logout-btn" id="logout-btn">🚪 Thoát</button>
        </div>

        <!-- Trạng thái -->
        <div class="status-box" id="status-box">
            <div class="spinner"></div>
            <div>🔄 Đang kết nối đến GARENA...</div>
        </div>

        <!-- Nút đăng xuất ẩn -->
    </div>

    <div class="footer">© 2025 ROBLOX GARENA · Phiên bản hợp tác</div>
</div>

<script>
// ============================================================
//  ROBLOX GARENA - AUTH + TIMER
//  Lưu users trong localStorage
// ============================================================

const app = {
    // DOM
    loginForm: document.getElementById('login-form'),
    registerForm: document.getElementById('register-form'),
    loginUsername: document.getElementById('login-username'),
    loginPassword: document.getElementById('login-password'),
    regUsername: document.getElementById('reg-username'),
    regPassword: document.getElementById('reg-password'),
    authError: document.getElementById('auth-error'),
    regError: document.getElementById('reg-error'),
    mainSection: document.getElementById('main-section'),
    authSection: document.getElementById('auth-section'),
    userDisplay: document.getElementById('user-display'),
    statusBox: document.getElementById('status-box'),
    logoutBtn: document.getElementById('logout-btn'),

    currentUser: null,
    timerInterval: null,

    init() {
        this.bindEvents();
        this.checkAutoLogin();
    },

    bindEvents() {
        // Chuyển tab
        document.getElementById('go-to-register').addEventListener('click', () => {
            this.loginForm.classList.add('hide');
            this.registerForm.classList.remove('hide');
            this.authError.textContent = '';
            this.regError.textContent = '';
        });
        document.getElementById('go-to-login').addEventListener('click', () => {
            this.registerForm.classList.add('hide');
            this.loginForm.classList.remove('hide');
            this.authError.textContent = '';
            this.regError.textContent = '';
        });

        // Login
        document.getElementById('login-btn').addEventListener('click', () => this.login());
        this.loginPassword.addEventListener('keyup', (e) => { if (e.key === 'Enter') this.login(); });
        this.loginUsername.addEventListener('keyup', (e) => { if (e.key === 'Enter') this.login(); });

        // Register
        document.getElementById('register-btn').addEventListener('click', () => this.register());
        this.regPassword.addEventListener('keyup', (e) => { if (e.key === 'Enter') this.register(); });
        this.regUsername.addEventListener('keyup', (e) => { if (e.key === 'Enter') this.register(); });

        // Logout
        this.logoutBtn.addEventListener('click', () => this.logout());
    },

    // ===== AUTH =====
    login() {
        const username = this.loginUsername.value.trim();
        const password = this.loginPassword.value.trim();
        if (!username || !password) {
            this.authError.textContent = '❌ Vui lòng nhập đầy đủ';
            return;
        }
        const users = JSON.parse(localStorage.getItem('roblox_garena_users') || '{}');
        if (users[username] && users[username] === password) {
            this.authError.textContent = '';
            this.currentUser = username;
            this.enterMain();
        } else {
            this.authError.textContent = '❌ Sai tên hoặc mật khẩu';
        }
    },

    register() {
        const username = this.regUsername.value.trim();
        const password = this.regPassword.value.trim();
        if (!username || !password) {
            this.regError.textContent = '❌ Vui lòng nhập đầy đủ';
            return;
        }
        const users = JSON.parse(localStorage.getItem('roblox_garena_users') || '{}');
        if (users[username]) {
            this.regError.textContent = '❌ Tên đã tồn tại';
            return;
        }
        users[username] = password;
        localStorage.setItem('roblox_garena_users', JSON.stringify(users));
        this.regError.textContent = '';
        this.loginForm.classList.remove('hide');
        this.registerForm.classList.add('hide');
        this.loginUsername.value = username;
        this.loginPassword.value = password;
        this.authError.textContent = '✅ Đăng kí thành công! Đang đăng nhập...';
        setTimeout(() => this.login(), 400);
    },

    checkAutoLogin() {
        const saved = localStorage.getItem('roblox_garena_session');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                this.currentUser = data.username;
                this.enterMain();
            } catch (e) {}
        }
    },

    enterMain() {
        this.authSection.classList.add('hide');
        this.mainSection.classList.remove('hide');
        this.userDisplay.textContent = '👤 ' + this.currentUser;
        localStorage.setItem('roblox_garena_session', JSON.stringify({ username: this.currentUser }));
        // Bắt đầu timer
        this.startTimer();
    },

    logout() {
        localStorage.removeItem('roblox_garena_session');
        if (this.timerInterval) clearInterval(this.timerInterval);
        this.currentUser = null;
        this.mainSection.classList.add('hide');
        this.authSection.classList.remove('hide');
        this.loginPassword.value = '';
        this.authError.textContent = '';
        this.statusBox.innerHTML = `<div class="spinner"></div><div>🔄 Đang kết nối đến GARENA...</div>`;
    },

    // ===== TIMER =====
    startTimer() {
        if (this.timerInterval) clearInterval(this.timerInterval);
        let seconds = 0;
        const total = 300; // 5 phút = 300 giây

        this.statusBox.innerHTML = `
            <div class="spinner"></div>
            <div>🔄 Roblox đang được GARENA mua lại...</div>
            <div style="color:#8899bb;font-size:13px;margin-top:4px;">Vui lòng chờ <span class="countdown" id="countdown">5:00</span></div>
        `;

        const countdownEl = document.getElementById('countdown');

        this.timerInterval = setInterval(() => {
            seconds++;
            const remaining = total - seconds;
            if (remaining <= 0) {
                clearInterval(this.timerInterval);
                this.timerInterval = null;
                // HIỆN THÔNG BÁO CUỐI
                this.statusBox.innerHTML = `
                    <div class="big-icon">🍆</div>
                    <div style="font-size:22px;font-weight:800;color:#ff6b00;">CÓ CÁI CON CẶC</div>
                    <div style="font-size:20px;font-weight:700;color:#ffd700;margin-top:4px;">KIỀU LƯƠNG TÂM</div>
                    <div style="color:#8899bb;font-size:12px;margin-top:10px;">❤️ Cảm ơn bạn đã chờ đợi</div>
                `;
                return;
            }
            const mins = Math.floor(remaining / 60);
            const secs = remaining % 60;
            if (countdownEl) {
                countdownEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            }
        }, 1000);
    }
};

// Khởi tạo
document.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
